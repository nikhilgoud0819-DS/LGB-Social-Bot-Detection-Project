<!DOCTYPE html>
<html>

<head>

    <title>Prediction History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<a href="/" class="home-btn">🏠 Back to Home</a>

<div class="dashboard">

    <h1>📜 Prediction History</h1>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>ID</th>
            <th>Tweet</th>
            <th>Prediction</th>
        </tr>

        {% for row in records %}

        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
